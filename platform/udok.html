<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0d16">
<title>Udok · UDOKS Creative Companion</title>
<style>
:root{--ink:#0a0d16;--panel:#11141f;--panel2:#171b2b;--line:#292d42;--paper:#eee9df;--muted:#969bb0;--gold:#c9a768;--blue:#2d3a5c}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse 620px 420px at 50% -8%,#c9a76817,transparent 62%),var(--ink);color:var(--paper);padding:18px;display:grid;place-items:center}
.app{width:min(100%,900px);height:min(900px,94vh);min-height:560px;background:var(--panel);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 90px #0008}
header{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.mark{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#1b2030;border:1px solid #45402f;color:var(--gold);font-weight:900;font-size:20px}
.headtext{flex:1;min-width:0}.headtext strong{font:20px Georgia,serif;display:block}.eyebrow{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}button,a{font:inherit}button,.linkbtn{border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--paper);padding:9px 12px;text-decoration:none;cursor:pointer}button:hover,.linkbtn:hover{border-color:var(--gold)}button:disabled{opacity:.45;cursor:default}
.shortcuts{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;border-bottom:1px solid var(--line)}.shortcuts button{white-space:nowrap;font-size:12px;color:#e6d4ae}
.chat{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}.msg{max-width:min(760px,90%);padding:12px 15px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}.user{align-self:flex-end;background:var(--blue);border-bottom-right-radius:4px}.assistant{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:4px}.meta{font-size:10px;color:var(--muted);margin-bottom:4px}.notice{padding:9px 16px;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}
form{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line)}textarea{flex:1;min-width:0;resize:vertical;min-height:48px;max-height:160px;background:#0d101a;border:1px solid #34394f;border-radius:12px;color:var(--paper);padding:12px;font:inherit}textarea:focus{outline:2px solid #c9a76866;border-color:var(--gold)}.send{background:linear-gradient(140deg,#d8bd82,#927341);color:#10111a;border:0;font-weight:800;min-width:78px}
@media(max-width:600px){body{padding:0}.app{height:100dvh;min-height:0;border-radius:0;border:0}.headtext strong{font-size:17px}.actions .linkbtn{display:none}.chat{padding:14px}.msg{max-width:96%}header{padding:12px}.shortcuts{padding:9px 12px}form{padding:10px}}
</style>
</head>
<body>
<main class="app">
<header>
  <div class="mark" aria-hidden="true">U</div>
  <div class="headtext"><strong>Udok · Creative Companion</strong><div class="eyebrow">UDOKS Animation Platform · UD🏀KA / YSL ENT</div></div>
  <div class="actions"><a class="linkbtn" href="index.html">← Studio</a><button id="clear" type="button" title="Clear local chat history">Reset</button></div>
</header>
<nav class="shortcuts" aria-label="Creative starters">
  <button type="button" data-prompt="Help me turn this idea into a cinematic animation brief with a clear opening, continuous action, camera movement, lighting, and ending: ">🎬 Animation brief</button>
  <button type="button" data-prompt="Help me create a shot-by-shot music video plan for a UD🏀KA / YSL ENT song. Ask for the track details you need, then give scene timings and copy-ready prompts: ">♫ Music video</button>
  <button type="button" data-prompt="Build a character continuity sheet for my original character. Preserve face, hair, skin, outfit, accessories, proportions, and screen direction across every shot. Character details: ">◈ Character continuity</button>
  <button type="button" data-prompt="Help me troubleshoot my UDOKS Animation Platform. The problem and what I see are: ">⚙ Fix a problem</button>
</nav>
<section class="chat" id="chat" aria-live="polite"></section>
<div class="notice" id="status">Chat requires the UDOKS backend to be configured. Your conversation history is stored only in this browser.</div>
<form id="form">
  <textarea id="input" rows="1" maxlength="12000" placeholder="What are we making today? (Enter to send, Shift+Enter for a new line)" aria-label="Message to Udok"></textarea>
  <button class="send" id="send" type="submit">Send ↗</button>
</form>
</main>
<script>
(()=> {
  const KEY='udoks:udok:messages:v1', chat=document.getElementById('chat'), form=document.getElementById('form'), input=document.getElementById('input'), send=document.getElementById('send'), status=document.getElementById('status');
  // Configured API origin supplied for the current Render setup. Keep provider secrets on the server.
  const API_BASE_URL = 'https://react-starter-studio.onrender.com';
  const welcome={role:'assistant',content:"Hey, I'm Udok — your creative partner inside UDOKS. I can help shape cinematic scenes, keep your character consistent, plan UD🏀KA music videos, write generation prompts, and troubleshoot the studio. I’ll be clear about what the platform can plan versus what requires a connected AI video provider. What are we creating today? 🏀"};
  let messages=[];
  try { const saved=JSON.parse(localStorage.getItem(KEY)||'[]'); messages=Array.isArray(saved)&&saved.length?saved:[welcome]; } catch { messages=[welcome]; }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(messages.slice(-40)))}catch{}}
  function render(m){const el=document.createElement('div');el.className='msg '+(m.role==='user'?'user':'assistant');const label=document.createElement('div');label.className='meta';label.textContent=m.role==='user'?'YOU':'UDOK';el.append(label,document.createTextNode(m.content));chat.append(el);chat.scrollTop=chat.scrollHeight}
  function redraw(){chat.replaceChildren();messages.forEach(render)}
  redraw();
  async function submit(text){
    if(!text||send.disabled)return;
    messages.push({role:'user',content:text});render(messages[messages.length-1]);save();input.value='';input.style.height='auto';send.disabled=true;status.textContent='Udok is preparing a reply…';
    const typing={role:'assistant',content:'Thinking…'};render(typing);
    try{
      const response=await fetch(`${API_BASE_URL}/api/udok/chat`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:messages.filter(m=>m.role==='user'||m.role==='assistant').slice(-20)})});
      let data={};try{data=await response.json()}catch{}
      if(!response.ok)throw new Error(data.error||('Request failed ('+response.status+').'));
      if(typeof data.reply!=='string'||!data.reply.trim())throw new Error('The server returned an empty reply.');
      messages.push({role:'assistant',content:data.reply.trim()});save();status.textContent='Connected to the UDOKS companion service.';
    }catch(err){
      messages.push({role:'assistant',content:'I could not reach the Udok service. '+(err.message||'Please try again.')+'\n\nThe chat page needs a backend at /api/udok/chat and a server-side ANTHROPIC_API_KEY. No API key should be placed in this HTML file.'});save();status.textContent='Backend unavailable or not configured.';
    }finally{send.disabled=false;redraw();input.focus()}
  }
  form.addEventListener('submit',e=>{e.preventDefault();submit(input.value.trim())});
  input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
  input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,160)+'px'});
  document.querySelectorAll('[data-prompt]').forEach(btn=>btn.addEventListener('click',()=>{input.value=btn.dataset.prompt;input.focus();input.setSelectionRange(input.value.length,input.value.length)}));
  document.getElementById('clear').addEventListener('click',()=>{if(confirm('Clear Udok chat history saved in this browser?')){messages=[welcome];save();redraw();status.textContent='Local chat history cleared.'}});
})();
</script>
</body>
</html>
